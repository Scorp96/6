name: SCORP P0 fresh-only Limited installer candidate
on:
  push:
    branches:
      - audit/p0-fresh-install-limited-no-clobber-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-p0-fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ten isolated release integrity and Git-blob CRLF tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_scorp_p0_release_verify.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'P0_RELEASE_MANIFEST_TESTS_FAILED' }
      - name: Verify actual candidate is blocked rather than falsely release-ready
        shell: pwsh
        run: |
          $result = @(python scripts/scorp_p0_release_verify.py --repo-root .)
          if ($LASTEXITCODE -ne 2) { throw 'CANDIDATE_RELEASE_PREFLIGHT_DID_NOT_FAIL_CLOSED' }
          # A BLOCKED preflight intentionally exits 2; reset the shell's external
          # exit status only after verifying that exact failure mode.
          $global:LASTEXITCODE = 0
          $report = $result[-1] | ConvertFrom-Json
          if ($report.result -cne 'BLOCKED' -or $report.total_files -ne 7 -or $report.blocked_files -lt 1 -or $report.release_authorized) {
            throw 'CANDIDATE_RELEASE_PREFLIGHT_INVALID'
          }
          $mismatched = @($report.checks | Where-Object { $_.git_blob -eq 'MISMATCH' }).Count
          $unfixed = @($report.checks | Where-Object { $_.sha256 -eq 'UNPINNED' }).Count
          if ($mismatched -ne 4 -or $unfixed -ne 7) { throw 'RELEASE_BLOCKER_EVIDENCE_UNEXPECTED' }
          Write-Host "RELEASE_CANDIDATE_FAIL_CLOSED_PASS; git_blobs_mismatch=$mismatched; unpinned_sha256=$unfixed"
      - name: Limited-task bootstrap must reject before first filesystem write
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-limited-runlevel.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_LIMITED_TASK_BOOTSTRAP_FAILED' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-preflight-before-writes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_BOOTSTRAP_FIRST_SIDE_EFFECT_FENCE_FAILED' }
      - name: Legacy installer must fail closed on existing task and require an explicit pinned fresh Limited task
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-fresh-installer-no-clobber.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_FRESH_INSTALLER_NO_CLOBBER_FAILED' }
      - name: Full Windows R2 offline regression, no browser sends
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R2_OFFLINE_REGRESSION_FAILED' }
      - name: Check full candidate diff
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin audit/p0-bootstrap-no-write-preflight-20261010
          git diff --check FETCH_HEAD HEAD
