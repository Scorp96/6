name: SCORP P0 final Broker prevalidator fence plus release audit artifact
on:
  push:
    branches:
      - audit/p0-final-broker-prevalidate-fence-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-p0-final-broker-prevalidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ten isolated release integrity and Git-blob CRLF tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_scorp_p0_release_verify.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'P0_RELEASE_MANIFEST_TESTS_FAILED' }
      - name: Verify actual candidate is blocked rather than falsely release-ready
        shell: pwsh
        run: |
          $result = @(python scripts/scorp_p0_release_verify.py --repo-root .)
          if ($LASTEXITCODE -ne 2) { throw 'CANDIDATE_RELEASE_PREFLIGHT_DID_NOT_FAIL_CLOSED' }
          # A BLOCKED preflight intentionally exits 2; reset the shell's external
          # exit status only after verifying that exact failure mode.
          $global:LASTEXITCODE = 0
          $report = $result[-1] | ConvertFrom-Json
          if ($report.result -cne 'BLOCKED' -or $report.total_files -ne 7 -or $report.blocked_files -lt 1 -or $report.release_authorized) {
            throw 'CANDIDATE_RELEASE_PREFLIGHT_INVALID'
          }
          $mismatched = @($report.checks | Where-Object { $_.git_blob -eq 'MISMATCH' }).Count
          $unfixed = @($report.checks | Where-Object { $_.sha256 -eq 'UNPINNED' }).Count
          if ($mismatched -ne 4 -or $unfixed -ne 7) { throw 'RELEASE_BLOCKER_EVIDENCE_UNEXPECTED' }
          Write-Host "RELEASE_CANDIDATE_FAIL_CLOSED_PASS; git_blobs_mismatch=$mismatched; unpinned_sha256=$unfixed"
      - name: Limited-task bootstrap must reject before first filesystem write
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-limited-runlevel.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_LIMITED_TASK_BOOTSTRAP_FAILED' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-preflight-before-writes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_BOOTSTRAP_FIRST_SIDE_EFFECT_FENCE_FAILED' }
      - name: Legacy installer must fail closed on existing task and require an explicit pinned fresh Limited task
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-fresh-installer-no-clobber.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_FRESH_INSTALLER_NO_CLOBBER_FAILED' }
      - name: Install isolated Windows Broker tests-only dependency
        shell: pwsh
        run: |
          python -m pip install pywin32==312
          if ($LASTEXITCODE -ne 0) { throw 'BROKER_TEST_DEPENDENCY_FAILED' }
      - name: Broker service and any future-operation deny-by-default regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path 'scorp-agent/privileged-broker').Path
          python -m unittest discover -s scorp-agent/privileged-broker/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'BROKER_POSITIVE_ALLOWLIST_REGRESSION_FAILED' }
      - name: Legacy read-only executor claims must be rejected before side effects
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-readonly-envelope-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_EXECUTOR_SIDE_EFFECT_GATE_FAILED' }
      - name: Broker installer default-deny source and isolated no-write executable canaries
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\privileged-broker\tests\p0-broker-fresh-installer-preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_BROKER_INSTALLER_NO_WRITE_DENIAL_FAILED' }
      - name: Six immutable commit SHA pin-plan positive and negative proofs
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_scorp_p0_release_pin_plan.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'RELEASE_PIN_PLAN_TESTS_FAILED' }
      - name: Reproduce exact current candidate SHA1 and SHA256 without modifying the manifest
        shell: pwsh
        run: |
          $lines = @(python scripts/scorp_p0_release_pin_plan.py --repo-root . --expected-head $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'RELEASE_PIN_PLAN_FAILED' }
          $plan = $lines[-1] | ConvertFrom-Json
          if ($plan.candidate_source_commit_sha -cne $env:GITHUB_SHA -or
              $plan.current_manifest_result -cne 'BLOCKED' -or
              $plan.release_authorized -or $plan.operator_signoff_attested -or
              $plan.windows_host_attested -or $plan.production_modified) {
            throw 'RELEASE_PIN_PLAN_FALSE_AUTHORITY'
          }
          if (@($plan.proposed_manifest.files.PSObject.Properties).Count -ne 7) {
            throw 'RELEASE_PIN_PLAN_BOM_INCOMPLETE'
          }
          foreach ($file in $plan.proposed_manifest.files.PSObject.Properties) {
            if ($file.Value.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                $file.Value.git_blob_sha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'RELEASE_PIN_PLAN_DIGEST_UNPINNED'
            }
          }
          Write-Host 'P0_PIN_PLAN_READY_FOR_OPERATOR_REVIEW_NOT_RELEASED'
      - name: Generate exact-head release pin review artifact, no release authority
        shell: pwsh
        run: |
          python scripts/scorp_p0_release_pin_plan.py --repo-root . --expected-head $env:GITHUB_SHA > scorp-p0-release-pin-review.json
          if ($LASTEXITCODE -ne 0) { throw 'RELEASE_PIN_REVIEW_ARTIFACT_FAILED' }
          $plan = Get-Content -LiteralPath scorp-p0-release-pin-review.json -Raw | ConvertFrom-Json
          if ($plan.candidate_source_commit_sha -cne $env:GITHUB_SHA -or $plan.release_authorized -or
              $plan.operator_signoff_attested -or $plan.windows_host_attested) {
            throw 'RELEASE_PIN_REVIEW_ARTIFACT_NOT_FAIL_CLOSED'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: scorp-p0-review-pins-${{ github.sha }}
          path: scorp-p0-release-pin-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Full Windows R2 offline regression, no browser sends
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R2_OFFLINE_REGRESSION_FAILED' }
      - name: Check full candidate diff
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin audit/p0-release-review-pin-plan-20261010
          git diff --check FETCH_HEAD HEAD
