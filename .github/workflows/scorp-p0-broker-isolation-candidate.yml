name: SCORP P0 Broker isolation candidate
on:
  push:
    branches:
      - audit/p0-broker-trust-boundary-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-p0-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-offline-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Required for HEAD^ whitespace diff check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only Windows dependencies
        run: python -m pip install pywin32==312
      - name: Broker unit tests (no service installation or privileged effects)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path scorp-agent/privileged-broker).Path
          python -m unittest discover -s scorp-agent/privileged-broker/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'BROKER_OFFLINE_TESTS_FAILED' }
      - name: Verify protected diff whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD
