name: SCORP mainline P0 Broker read-only review
on:
  push:
    branches:
      - audit/mainline-broker-readonly-p0-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-mainline-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-broker-review:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject ancestry drift and unrelated changes
        shell: pwsh
        run: |
          git fetch --quiet origin main
          $base = (git merge-base HEAD origin/main).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $base -cne $main) {
            throw 'P0_MAINLINE_REVIEW_BASE_DRIFT'
          }
          $allowed = @(
            'scorp-agent/privileged-broker/broker_service.py',
            'scorp-agent/privileged-broker/tests/test_broker_readonly_p0.py',
            '.github/workflows/scorp-mainline-p0-broker-containment-review.yml',
            'docs/SCORP_MAINLINE_BROKER_P0_20261010.md'
          )
          $actual = @(git diff --name-only origin/main...HEAD)
          if ($LASTEXITCODE -ne 0 -or @($actual).Count -lt 3) { throw 'P0_MAINLINE_REVIEW_EMPTY_OR_DIFF_ERROR' }
          foreach ($p in $actual) {
            if ($p -cnotin $allowed) { throw ('P0_MAINLINE_UNRELATED_CHANGE:' + $p) }
          }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P0_MAINLINE_DIFF_WHITESPACE_ERROR' }
          Write-Host "MAINLINE_NARROW_DIFF_PASS file_count=$(@($actual).Count)"
      - name: Broker test-only Windows dependency
        shell: pwsh
        run: |
          python -m pip install pywin32==312
          if ($LASTEXITCODE -ne 0) { throw 'BROKER_TEST_ONLY_DEPENDENCY_FAILED' }
      - name: Every Broker old and new test, no actual SYSTEM service
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path -LiteralPath 'scorp-agent/privileged-broker').Path
          python -B -m unittest discover -s scorp-agent/privileged-broker/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'P0_BROKER_MAINLINE_TEST_FAILED' }
      - name: Full mainline V4 and browser offline tests
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_MAINLINE_R2_OFFLINE_FAILED' }
      - name: Final no-install assertion
        shell: pwsh
        run: |
          $candidate = Get-Content -LiteralPath 'scorp-agent/privileged-broker/broker_service.py' -Raw
          if ($candidate -notmatch '_READ_ONLY_OPERATIONS' -or
              $candidate -notmatch 'BROKER_MUTATION_DISABLED_PENDING_TASK_APPROVAL') {
            throw 'P0_BROKER_AUTHORITY_DISABLED_OR_NOT_REVIEWED'
          }
          Write-Host 'SOURCE_CI_ONLY_NO_SERVICE_INSTALLED_NO_RELEASE_APPROVED'
