name: SCORP mainline P0 Bootstrap task authority
on:
  push:
    branches:
      - audit/mainline-p0-bootstrap-task-fence-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-main-p0-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-only:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one commit and exactly seven reviewed mainline paths
        shell: pwsh
        run: |
          git fetch --quiet origin main
          $main = (git rev-parse origin/main).Trim()
          $base = (git merge-base HEAD origin/main).Trim()
          $ahead = (git rev-list --count origin/main..HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $main -cne $base -or $ahead -ne '1') { throw 'P0_MAINLINE_ANCESTRY_INVALID' }
          $allow = @(
            'scorp-agent/bootstrap-v4.ps1',
            'scorp-agent/install.ps1',
            'scorp-agent/tests/v4-bootstrap-limited-runlevel.ps1',
            'scorp-agent/tests/v4-bootstrap-preflight-before-writes.ps1',
            'scorp-agent/tests/v4-fresh-installer-no-clobber.ps1',
            'docs/SCORP_MAINLINE_BOOTSTRAP_TASK_AUTHORITY_20261010.md',
            '.github/workflows/scorp-mainline-p0-bootstrap-task-review.yml'
          )
          $changed = @(git diff --name-only origin/main...HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 7) { throw 'P0_MAINLINE_BOOTSTRAP_SCOPE_INVALID' }
          foreach ($file in $changed) {
            if ($file -cnotin $allow) { throw ('P0_MAINLINE_EXTRA_FILE:'+$file) }
          }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P0_MAINLINE_DIFF_HYGIENE_FAILED' }
          Write-Host 'P0_MAIN_BOOTSTRAP_ONE_COMMIT_SEVEN_PATHS_PASS'
      - name: P0 Limited-only bootstrap and first-write safety checks
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-limited-runlevel.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_BOOTSTRAP_LIMITED_AUTHORITY_FAILED' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-bootstrap-preflight-before-writes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_BOOTSTRAP_FIRST_WRITE_GATE_FAILED' }
      - name: P0 fresh-only Windows installer two default-denial probes
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-fresh-installer-no-clobber.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_TASK_INSTALLER_DEFAULT_DENIAL_FAILED' }
      - name: Full mainline offline R2 and GUI Bridge regression
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_MAINLINE_OFFLINE_VALIDATION_FAILED' }
      - name: No production installation or restart
        shell: pwsh
        run: |
          Write-Host 'P0_SOURCE_CI_ONLY_R1_UNCHANGED'
          Write-Host 'NO_PRODUCTION_TASK_SERVICE_OR_BROWSER_MODIFIED'
