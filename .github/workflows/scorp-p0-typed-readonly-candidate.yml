name: SCORP P0 typed read-only probes candidate
on:
  push:
    branches:
      - audit/p0-typed-readonly-observers-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorp-p0-typed-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New typed read-only Windows diagnostics
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-typed-readonly-diagnostics.ps1
          if ($LASTEXITCODE -ne 0) { throw 'TYPED_READONLY_DIAGNOSTICS_FAILED' }
      - name: Original 9 negative read-only envelope cases
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scorp-agent\tests\v4-readonly-envelope-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_ENVELOPE_CONTRACT_FAILED' }
      - name: Full R2 offline regression
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R2_OFFLINE_REGRESSION_FAILED' }
      - name: Changed-file whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD
