name: SCORP mainline P0 Worker bearer token prompt secrecy
on:
  push:
    branches:
      - audit/mainline-p0-worker-token-secret-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-no-secret-leak:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exactly six mainline review paths and one commit
        shell: pwsh
        run: |
          git fetch --quiet origin main
          $base = (git merge-base HEAD origin/main).Trim()
          $main = (git rev-parse origin/main).Trim()
          $ahead = (git rev-list --count origin/main..HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $base -cne $main -or $ahead -ne '1') { throw 'P0_MAIN_ANCESTRY_INVALID' }
          $allow = @(
            'scorp-agent/master_a_dynamic_v4/master_controller.py',
            'scorp-agent/chatgpt-gui-bridge/v4_bridge_gateway.py',
            'scorp-agent/master_a_dynamic_v4/tests/test_master_controller.py',
            'scorp-agent/chatgpt-gui-bridge/tests/test_v4_bridge_gateway.py',
            '.github/workflows/scorp-mainline-p0-worker-token-secret-review.yml',
            'docs/SCORP_MAINLINE_WORKER_TOKEN_SECRECY_20261010.md'
          )
          $files = @(git diff --name-only origin/main...HEAD)
          if ($LASTEXITCODE -ne 0 -or $files.Count -ne 6) { throw 'P0_DIFF_SCOPE_INVALID' }
          foreach ($p in $files) { if ($p -cnotin $allow) { throw ('P0_OUTSIDE_SCOPE:'+$p) } }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P0_DIFF_HYGIENE_FAILED' }
      - name: Full Windows R2 and GUI Bridge offline regression
        shell: pwsh
        env:
          SCORP_PYTHON: python
        run: |
          .\scripts\run-candidate-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P0_WORKER_SECRET_LEAK_REGRESSION' }
      - name: Declare host and browser unchanged
        shell: pwsh
        run: |
          Write-Host 'NO_HOST_MUTATION_NO_BROWSER_SEND_NO_DEPLOY'
